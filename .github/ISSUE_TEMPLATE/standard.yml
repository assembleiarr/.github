name: Standard
description: Aplicar neste repo um padrão do app-catalog.
labels: [standard]
body:
  - type: markdown
    attributes:
      value: |
        Issues com a label `standard` que valem para vários apps são idênticas
        em todos os repos: mesmo título, mesmo corpo e mesma label. Só a seção
        "Notas deste repo" muda.
  - type: input
    id: standard-doc
    attributes:
      label: Padrão
      description: Caminho do documento no app-catalog.
      placeholder: docs/padroes/<arquivo>.md ou docs/stacks/<stack>.md
    validations:
      required: true
  - type: input
    id: parent-issue
    attributes:
      label: Issue mãe
      placeholder: assembleiarr/app-catalog#N
    validations:
      required: false
  - type: textarea
    id: todo
    attributes:
      label: O que fazer
    validations:
      required: true
  - type: textarea
    id: done-criteria
    attributes:
      label: Critério de pronto
    validations:
      required: true
  - type: textarea
    id: repo-notes
    attributes:
      label: Notas deste repo
      description: O que é específico deste repo. Deixe em branco se não houver.
    validations:
      required: false
